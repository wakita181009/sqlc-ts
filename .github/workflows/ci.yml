name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 22 is the oldest supported runtime (engines.node); 26 is what development uses.
        node: [22, 24, 26]
    # The Postgres runtime tests run only when DATABASE_URL is set.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL: postgres://postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:coverage
      - uses: codecov/codecov-action@v7
        if: matrix.node == 26
        with:
          files: coverage/lcov.info
          fail_ci_if_error: true

  # Runs the real sqlc pinned in tools/sqlc/go.mod; this is what vets a Dependabot bump.
  # The fixtures regenerated with it must still typecheck and pass the tests (they are not
  # required to match the committed ones, whose header names the sqlc version), and it packs
  # every package `pnpm release` would publish, so a release missing an asset fails here.
  bundled-sqlc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm sqlc:fetch
      - run: pnpm fixture
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm pack:all
      - uses: actions/upload-artifact@v7
        with:
          name: packages
          path: .pack/
          # .pack is a dot directory, which upload-artifact skips by default.
          include-hidden-files: true
          if-no-files-found: error

  # Installs the packed tarballs the way a user would, on each OS with a platform package,
  # with the oldest supported Node, and generates the SQLite fixture with the bundled sqlc.
  install:
    needs: bundled-sqlc
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/download-artifact@v8
        with:
          name: packages
          path: .pack
      - run: |
          platform=$(node -p '`sqlc-ts-${process.platform}-${process.arch}`')
          version=$(node -p 'require("./package.json").version')
          sqlc=$(sed -n 's|^require github.com/sqlc-dev/sqlc v||p' tools/sqlc/go.mod)
          dir=$(mktemp -d)
          cp ".pack/sqlc-ts-$version.tgz" ".pack/$platform-$version.tgz" "$dir"
          cp -r test/fixture/sqlite/sqlc.yaml test/fixture/sqlite/migrations test/fixture/sqlite/queries "$dir"
          cd "$dir"
          npm init -y > /dev/null
          npm install -D "./sqlc-ts-$version.tgz" "./$platform-$version.tgz"
          test "$(./node_modules/.bin/sqlc-ts sqlc version)" = "v$sqlc"
          ./node_modules/.bin/sqlc-ts generate codegen_request.json gen
          ls gen
          test -f gen/titles.ts
