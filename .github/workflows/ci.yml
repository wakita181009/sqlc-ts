name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 22 is the oldest supported runtime (engines.node); 26 is what development uses.
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:coverage
      - uses: codecov/codecov-action@v7
        if: matrix.node == 26
        with:
          files: coverage/lcov.info
          fail_ci_if_error: true

  # Runs the real sqlc pinned in tools/sqlc/go.mod from the platform package: the fixtures
  # regenerated through `sqlc-ts generate` must still typecheck and pass the tests. This is
  # what vets a Dependabot bump of sqlc; the committed fixtures are not required to match,
  # since their header names the sqlc version.
  bundled-sqlc:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Linux fetches every platform, so a release missing an asset fails before publishing.
      - if: runner.os == 'Linux'
        run: pnpm sqlc:fetch
      - if: runner.os != 'Linux'
        run: pnpm sqlc:fetch --current
      - run: pnpm fixture
      - run: pnpm typecheck
      - run: pnpm test
