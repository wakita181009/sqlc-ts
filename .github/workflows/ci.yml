name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 22 is the oldest supported runtime (engines.node); 26 is what development uses.
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:coverage
      - uses: codecov/codecov-action@v7
        if: matrix.node == 26
        with:
          files: coverage/lcov.info
          fail_ci_if_error: true

  # Runs the real sqlc pinned in tools/sqlc/go.mod. This is what vets a Dependabot bump:
  # - the fixtures regenerated with it must still typecheck and pass the tests (they are not
  #   required to match the committed ones, whose header names the sqlc version);
  # - the packages `pnpm release` would publish must install and generate like a user's.
  bundled-sqlc:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm sqlc:fetch
      - run: pnpm fixture
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # Linux packs every platform, so a release missing an asset fails before publishing.
      - if: runner.os == 'Linux'
        run: node scripts/sqlc-packages.ts pack .pack
      - if: runner.os != 'Linux'
        run: node scripts/sqlc-packages.ts pack .pack --current
      - name: Install the packages and generate, as a user would
        run: |
          pack="$PWD/.pack"
          platform=$(node -p '`sqlc-ts-${process.platform}-${process.arch}`')
          version=$(node -p 'require("./package.json").version')
          dir=$(mktemp -d)
          cp -r test/fixture/sqlite/sqlc.yaml test/fixture/sqlite/migrations test/fixture/sqlite/queries "$dir"
          cd "$dir"
          npm init -y > /dev/null
          npm install -D "$pack/sqlc-ts-$version.tgz" "$pack/$platform-$version.tgz"
          ./node_modules/.bin/sqlc-ts generate codegen_request.json gen
          test -f gen/titles.ts
