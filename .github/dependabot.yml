version: 2
updates:
  # Prefixes keep release-please from bumping the version for dev-only updates; only the
  # sqlc bump ships to users, so it is a fix that goes into the changelog.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
  # Only sqlc, the release bundled into the platform packages (see tools/sqlc/tools.go).
  - package-ecosystem: "gomod"
    directory: "/tools/sqlc"
    schedule:
      interval: "weekly"
    allow:
      - dependency-name: "github.com/sqlc-dev/sqlc"
    commit-message:
      prefix: "fix(sqlc)"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci(deps)"
